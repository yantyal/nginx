# Define upstream (load balancing target)
upstream app_backend {
    server nginx-app1;
    server nginx-app2;
}

server {
    listen 80;

    # Optional: Individual routing
    location /app1/ {
        proxy_pass http://nginx-app1/;
    }

    location /app2/ {
        proxy_pass http://nginx-app2/;
    }

    # Load balancing for /app/
    location /app/ {
        proxy_pass http://app_backend/;
    }
}
